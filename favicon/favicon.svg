<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c471f5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon outer -->
  <polygon points="32,2 58,16 58,48 32,62 6,48 6,16"
           fill="none" stroke="url(#grad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Hexagon inner -->
  <polygon points="32,10 50,20 50,44 32,54 14,44 14,20"
           fill="rgba(0,212,255,0.05)" stroke="url(#grad)" stroke-width="0.8" opacity="0.6"/>

  <!-- Letter A -->
  <polyline points="20,44 32,18 44,44" fill="none" stroke="url(#grad)" stroke-width="2.5" stroke-linejoin="miter" filter="url(#glow)"/>
  <line x1="24" y1="34" x2="40" y2="34" stroke="url(#grad)" stroke-width="2" filter="url(#glow)"/>

  <!-- Code brackets </> accent -->
  <polyline points="16,22 13,18 10,22" fill="none" stroke="#00d4ff" stroke-width="1" stroke-linejoin="miter" opacity="0.7"/>
  <polyline points="48,42 51,46 54,42" fill="none" stroke="#c471f5" stroke-width="1" stroke-linejoin="miter" opacity="0.7"/>
</svg>
